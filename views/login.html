<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Admin sign in — Tournament Zone</title><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/admin.css"><script type="module" src="/login.js"></script></head><body><main class="login-shell"><a href="/" class="brand"><span class="brand-icon">♞</span><span>TOURNAMENT<span class="brand-sub">ZONE / ADMIN</span></span></a><section class="login-card"><span class="eyebrow">ORGANISER ACCESS</span><h1>Behind the board.</h1><p>Sign in to manage the tournament, registrations and payments.</p><form id="login-form"><label>Admin password<input type="password" name="password" required autocomplete="current-password" maxlength="200" autofocus></label><label>Authenticator code<input name="code" required inputmode="numeric" pattern="[0-9]{6}" minlength="6" maxlength="6" autocomplete="one-time-code" placeholder="6-digit code"></label><button class="button primary full">Sign in securely <span>↗</span></button><p id="login-error" class="error" role="alert"></p></form><p class="login-note">Use the time-based code from the authenticator app linked during setup. Sessions expire after 8 hours.</p></section><a class="back-link" href="/">← Back to the tournament</a></main></body></html>
